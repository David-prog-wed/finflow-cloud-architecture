server {
    listen 80;
    server_name localhost;

    # Servir SPA Estática
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Patrón Gateway Routing hacia el contenedor de FastAPI
    location /api/ {
        proxy_pass http://finflow-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Acceso a documentación interactiva OpenAPI/Swagger a través del Gateway
    location /docs {
        proxy_pass http://finflow-api:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://finflow-api:8000/openapi.json;
    }
}